<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>2학기 기말고사 대비 질문 체크리스트</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        .subtab-btn.active { background-color: #4f46e5; color: #ffffff; font-weight: 700; }

<body class="bg-slate-100 text-slate-800 pb-16">

    <!-- Header Section -->

                    <div id="progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-20 shadow-sm">
        <div class="max-w-md mx-auto flex text-sm text-center">
            <button onclick="switchEra('goryeo')" id="era-tab-goryeo" class="tab-btn active flex-1 py-3 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 transition-colors">

                <i class="fa-solid fa-rotate-left mr-1"></i> 다시 볼 것 (<span id="review-count">0</span>)
            </button>
        </div>
    </nav>

    <!-- Topic Subtabs Container -->
    <div id="subtab-container" class="bg-slate-200/80 border-b border-slate-300 sticky top-[97px] z-10">
        <div id="subtab-wrapper" class="max-w-md mx-auto px-3 py-2 flex gap-1.5 overflow-x-auto custom-scrollbar text-xs">
            <!-- Dynamic Subtabs populated by JS -->
        </div>
    </div>

    <!-- Main Content Area -->

        <!-- Topic Description Info -->
        <div id="topic-info" class="bg-indigo-50 border border-indigo-100 p-2.5 rounded-xl text-xs text-indigo-900 flex justify-between items-center">
            <span id="topic-title" class="font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-book-open text-indigo-600"></i> 주제 선택
            </span>
            <span id="topic-progress" class="text-[11px] font-semibold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">0/0</span>
        </div>

        <!-- Question List Container -->
        <div id="question-list" class="space-y-2.5">
            <!-- Questions rendered via Javascript -->
        </div>
    </main>

    <!-- Source Textbook Crop Viewer Modal -->
    <div id="source-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl relative">
            <button onclick="closeSourceModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center bg-slate-100">

            </button>
            <div class="flex items-center gap-2">

                <span id="modal-page" class="text-xs font-semibold text-slate-500">교재 쪽수</span>
            </div>
            <h3 id="modal-q-title" class="text-xs font-bold text-slate-700 border-b border-slate-100 pb-2 leading-snug">질문 제목</h3>
            
            <!-- Simulated PDF Text Crop Card -->
            <div class="bg-amber-50/80 border-2 border-amber-200/80 rounded-xl p-3 text-xs text-amber-950 font-serif leading-relaxed space-y-1.5 relative overflow-hidden">
                <div class="absolute -right-3 -top-3 text-amber-200/40 text-5xl pointer-events-none font-sans">
                    <i class="fa-solid fa-quote-right"></i>
                </div>

                확인 완료
            </button>
        </div>
    </div>

                page: '교재 134~139쪽',

            {

                question: '청과의 교류가 강조되며 청의 문물을 받아들이자는 주장은 무엇인가요?',
                page: '교재 134~139쪽',
                cropText: '조선 후기 북학파 실학자들이 청의 발전된 문물과 기술을 적극적으로 수용하자고 주장한 북학론입니다.'
            },
            {
                id: 63,
                era: 'joseon',
                topicId: 'joseon-4',
                topicName: '광해군 중립외교 & 호란 (134~139쪽)',
                question: '교과서 사료 확인) 쿠빌라이와 맺은 강화 내용을 꼼꼼하게 확인해 보았나요?',
                page: '교재 93~99쪽 사료',
                cropText: '사료 확인: 고려 태자(원종)와 쿠빌라이의 강화 - 고려의 사직과 풍속을 유지하고 의복과 법제를 바꿀 필요가 없음을 약조받았습니다.'
            }
        ];

        // Topics Definition
        const topics = {
            goryeo: [
                { id: 'all', name: '전체 보기' },
                { id: 'goryeo-1', name: '고려 대외관계' },
                { id: 'goryeo-2', name: '몽골 침략과 항쟁' },
                { id: 'goryeo-3', name: '원 간섭기 고려' },
                { id: 'goryeo-4', name: '공민왕 개혁 & 멸망' }
            ],
            joseon: [
                { id: 'all', name: '전체 보기' },
                { id: 'joseon-1', name: '통치체제 & 외교' },
                { id: 'joseon-2', name: '사림 & 사화·붕당' },
                { id: 'joseon-3', name: '임진왜란' },
                { id: 'joseon-4', name: '광해군 중립외교 & 호란' }
            ],
            review: [
                { id: 'all', name: '다시 볼 질문 모음' }
            ]
        };

        // App States
        let currentEra = 'goryeo';
        let currentSubtopic = 'all';
        let checkedState = JSON.parse(localStorage.getItem('joseon_checklist_states_v2') || '{}');

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            renderSubtabs();
            renderQuestions();
            updateProgress();
        });

        // Switch Main Era Tabs
        function switchEra(era) {
            currentEra = era;
            currentSubtopic = 'all';

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`era-tab-${era}`).classList.add('active');

            renderSubtabs();
            renderQuestions();
        }

        // Switch Subtopic
        function switchSubtopic(subtopicId) {
            currentSubtopic = subtopicId;
            document.querySelectorAll('.subtab-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById(`subtab-${subtopicId}`);
            if(targetBtn) targetBtn.classList.add('active');

            renderQuestions();
        }

        // Render Subtopic Buttons
        function renderSubtabs() {
            const container = document.getElementById('subtab-wrapper');
            container.innerHTML = '';

            const activeTopics = topics[currentEra] || [];
            activeTopics.forEach(t => {
                const btn = document.createElement('button');
                btn.id = `subtab-${t.id}`;
                btn.onclick = () => switchSubtopic(t.id);
                btn.className = `subtab-btn px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-300 text-slate-600 bg-white hover:bg-slate-50 transition-all ${t.id === currentSubtopic ? 'active' : ''}`;
                btn.textContent = t.name;
                container.appendChild(btn);
            });
        }

        // Render Question Item Cards
        function renderQuestions() {
            const listContainer = document.getElementById('question-list');
            listContainer.innerHTML = '';

            let filteredList = [];

            if (currentEra === 'review') {
                filteredList = checklistData.filter(q => !checkedState[q.id]);
            } else {
                filteredList = checklistData.filter(q => q.era === currentEra);
                if (currentSubtopic !== 'all') {
                    filteredList = filteredList.filter(q => q.topicId === currentSubtopic);
                }
            }

            // Update Topic Header Info
            const checkedInTopic = filteredList.filter(q => checkedState[q.id]).length;
            document.getElementById('topic-title').innerHTML = `<i class="fa-solid fa-book-open text-indigo-600"></i> ${
                currentEra === 'review' ? '체크 안 된 복습 필요 질문' : (currentSubtopic === 'all' ? (currentEra === 'goryeo' ? '고려 파트 전체' : '조선 파트 전체') : filteredList[0]?.topicName || '주제 질문')
            }`;
            document.getElementById('topic-progress').textContent = `${checkedInTopic} / ${filteredList.length} 완료`;

            if (filteredList.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-slate-400 space-y-2">
                        <i class="fa-solid fa-circle-check text-4xl text-emerald-400"></i>
                        <p class="text-xs font-bold text-slate-600">해당 조건에 문항이 없습니다!</p>
                        <p class="text-[11px]">모든 질문을 완료했거나 선택한 주제가 비어있습니다.</p>
                    </div>
                `;
                return;
            }

            filteredList.forEach(q => {
                const isChecked = !!checkedState[q.id];
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl p-3.5 border transition-all shadow-sm ${
                    isChecked ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200 hover:border-indigo-200'
                }`;

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <button onclick="toggleCheck(${q.id})" class="mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition-colors ${
                            isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white text-transparent hover:border-indigo-400'
                        }">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <div class="flex-1 space-y-1.5">
                            <p class="text-xs font-semibold leading-relaxed text-slate-800 ${isChecked ? 'line-through text-slate-400' : ''}">
                                ${q.question}
                            </p>
                            <div class="flex items-center justify-between pt-1 border-t border-slate-100">
                                <span class="text-[10px] text-slate-400 font-medium">${q.page}</span>
                                <button onclick="openSourceModal(${q.id})" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-2 py-0.5 rounded border border-indigo-200 flex items-center gap-1 transition-colors">
                                    <i class="fa-solid fa-magnifying-glass-plus text-[9px]"></i> 교과서 원문
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Toggle Question Check Status
        function toggleCheck(id) {
            checkedState[id] = !checkedState[id];
            localStorage.setItem('joseon_checklist_states_v2', JSON.stringify(checkedState));
            renderQuestions();
            updateProgress();
        }

        // Update Global Progress Bar
        function updateProgress() {
            const total = checklistData.length;
            const checkedCount = Object.keys(checkedState).filter(k => checkedState[k]).length;
            const percentage = Math.round((checkedCount / total) * 100);

            document.getElementById('progress-text').textContent = `${checkedCount} / ${total} 달성 (${percentage}%)`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('review-count').textContent = total - checkedCount;
        }

        // Open Source Crop Modal
        function openSourceModal(id) {
            const item = checklistData.find(q => q.id === id);
            if (!item) return;

            document.getElementById('modal-page').textContent = item.page;
            document.getElementById('modal-q-title').textContent = item.question;
            document.getElementById('modal-crop-text').textContent = item.cropText;

            document.getElementById('source-modal').classList.remove('hidden');
        }

        // Close Modal
        function closeSourceModal() {
            document.getElementById('source-modal').classList.add('hidden');
        }
    </script>
</body>
