<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>2학기 기말고사 대비 질문 체크리스트</title>
<style>
:root {
  --bg: #f4f2ec;
  --surface: #ffffff;
  --surface-2: #f8f7f3;
  --ink: #1f2430;
  --ink-2: #4b5365;
  --ink-3: #7a8294;
  --line: #e3e0d6;
  --brand: #3b3fa8;
  --brand-ink: #ffffff;
  --brand-soft: #e9eafc;
  --accent: #f0a81c;
  --ok: #1d9a6c;
  --ok-soft: #e1f5ec;
  --hint: #8a5a00;
  --hint-soft: #fff4d6;
  --ans: #0f6b4b;
  --ans-soft: #e1f5ec;
  --paper: #fffaf0;
  --paper-line: #ecd9a8;
  --shadow: 0 1px 2px rgba(31,36,48,.06), 0 4px 14px rgba(31,36,48,.06);
  --radius: 16px;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151c;
    --surface: #1e2029;
    --surface-2: #252835;
    --ink: #eceef4;
    --ink-2: #b6bccb;
    --ink-3: #8a91a3;
    --line: #333747;
    --brand: #9aa0ff;
    --brand-ink: #14151c;
    --brand-soft: #2a2d52;
    --ok: #4cc79a;
    --ok-soft: #173a2d;
    --hint: #f2c561;
    --hint-soft: #3a2f12;
    --ans: #6fe0b5;
    --ans-soft: #14352a;
    --paper: #2a2619;
    --paper-line: #5b4f2a;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(48px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* ---------- header ---------- */
.hero { background: linear-gradient(135deg, #2b2e86 0%, #3b3fa8 60%, #4b50c4 100%); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 0 20px; }
.hero .wrap { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; background: rgba(255,255,255,.16); padding: 3px 10px; border-radius: 999px; }
.hero h1 { margin: 6px 0 0; font-size: clamp(20px, 4.6vw, 28px); line-height: 1.25; font-weight: 800; }
.progress { min-width: 200px; flex: 1 1 200px; max-width: 340px; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.progress-top .big { font-size: 22px; color: #ffd873; }
.progress-top .sub { font-size: 13px; opacity: .85; font-weight: 500; }
.bar { height: 10px; background: rgba(0,0,0,.28); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd873, #f0a81c); border-radius: 999px; transition: width .3s ease; }

/* ---------- sticky nav ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; padding-top: 10px; }
.tab { flex: 1; min-height: var(--tap); border: 0; background: transparent; border-radius: 12px 12px 0 0; font-weight: 600; color: var(--ink-2); padding: 8px 6px; border-bottom: 3px solid transparent; font-size: 15px; }
.tab .n { font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 800; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; scroll-snap-align: start; min-height: 40px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

/* ---------- list ---------- */
main { padding-top: 16px; }
.topic-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--brand-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
.topic-bar .t { font-weight: 800; font-size: 15px; color: var(--brand); }
.topic-bar .c { font-weight: 700; font-size: 13px; background: var(--surface); border-radius: 999px; padding: 2px 12px; color: var(--ink-2); white-space: nowrap; }
.list { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
@media (min-width: 720px) { .list { grid-template-columns: 1fr 1fr; gap: 16px; } body { font-size: 17px; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; transition: border-color .2s, background .2s; }
.card.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface)); }
.card-main { display: flex; gap: 12px; align-items: flex-start; }
.check { flex: 0 0 auto; width: var(--tap); height: var(--tap); border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 20px; color: transparent; transition: all .15s; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.card-body { flex: 1; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
.num { font-size: 12px; font-weight: 800; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 1px 8px; }
.page { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.qtext { margin: 0; font-weight: 700; font-size: 1.02em; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
.card.done .qtext { color: var(--ink-3); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.act { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; line-height: 1.2; text-align: center; }
.act[aria-expanded="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.act.hint[aria-expanded="true"] { background: var(--hint-soft); border-color: var(--accent); color: var(--hint); }
.act.ans[aria-expanded="true"] { background: var(--ans-soft); border-color: var(--ok); color: var(--ans); }
.act[disabled] { opacity: .55; cursor: default; }
@media (max-width: 360px) { .act { font-size: 13px; } }

.reveal { display: grid; gap: 8px; margin-top: 10px; }
.reveal:empty { display: none; }
.box { border-radius: 12px; padding: 10px 14px; font-size: .94em; line-height: 1.6; }
.box b { display: block; font-size: 12px; margin-bottom: 2px; letter-spacing: .02em; }
.box.hint { background: var(--hint-soft); color: var(--hint); }
.box.ans { background: var(--ans-soft); color: var(--ans); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.box.ans p { margin: 0; color: var(--ink); }
.box.ans ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink); }

.empty { grid-column: 1 / -1; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 16px; color: var(--ink-2); }
.empty .big { font-size: 40px; }
.empty strong { display: block; margin-top: 6px; color: var(--ink); }

.foot { margin-top: 28px; text-align: center; }
.reset { border: 1px solid var(--line); background: transparent; color: var(--ink-3); border-radius: 999px; min-height: 40px; padding: 4px 16px; font-size: 13px; }

/* ---------- modal / bottom sheet ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(16,18,28,.55); display: none; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: var(--surface); width: 100%; max-width: 680px; max-height: 88vh; max-height: 88dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.25); animation: up .22s ease-out; padding-bottom: env(safe-area-inset-bottom); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 720px) { .overlay { align-items: center; padding: 24px; } .sheet { border-radius: 22px; max-height: 84vh; } }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.sheet-head .tt { flex: 1; min-width: 0; }
.sheet-head .lab { font-size: 12px; font-weight: 800; color: var(--brand); letter-spacing: .03em; }
.sheet-head h2 { margin: 2px 0 0; font-size: 15px; line-height: 1.5; font-weight: 700; word-break: keep-all; }
.close { flex: 0 0 auto; width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: var(--surface-2); font-size: 20px; line-height: 1; color: var(--ink-2); }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 20px 20px; display: grid; gap: 18px; }
.psg-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.psg-h .pp { font-size: 12px; font-weight: 800; color: var(--hint); background: var(--hint-soft); padding: 2px 10px; border-radius: 999px; }
.psg-h .pt { font-weight: 800; font-size: 15px; }
.psg { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 14px; padding: 14px 16px; font-family: "Noto Serif KR", "Batang", "Nanum Myeongjo", serif; font-size: 16px; line-height: 1.9; word-break: keep-all; overflow-wrap: anywhere; }
.psg p { margin: 0 0 .7em; }
.psg p:last-child { margin-bottom: 0; }
.psg .src { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; margin: .8em 0; font-size: .95em; }
.psg .src small { display: block; font-family: system-ui, sans-serif; font-size: 12px; color: var(--ink-3); }
.psg .note { font-family: system-ui, "Malgun Gothic", sans-serif; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 8px; padding: 6px 10px; }
.sheet-foot { padding: 10px 20px 14px; border-top: 1px solid var(--line); }
.sheet-foot button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 16px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow">역사 마무리 점검</span>
      <h1>2학기 기말고사<br>질문 체크리스트</h1>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-top"><span class="big" id="progress-text">0 / 63</span><span class="sub" id="progress-pct">0%</span></div>
      <div class="bar" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar-wrap"><i id="progress-bar"></i></div>
    </div>
  </div>
</header>

<nav class="nav" aria-label="단원 선택">
  <div class="wrap">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="chips" id="chips"></div>
  </div>
</nav>

<main class="wrap">
  <div class="topic-bar"><span class="t" id="topic-title"></span><span class="c" id="topic-progress"></span></div>
  <div class="list" id="list"></div>
  <div class="foot"><button class="reset" id="reset">체크 기록 초기화</button></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-q">
  <div class="sheet">
    <div class="sheet-head">
      <div class="tt"><div class="lab">📖 교과서 본문</div><h2 id="sheet-q"></h2></div>
      <button class="close" id="close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot"><button id="close2">확인 완료</button></div>
  </div>
</div>

<script>
/* ============================================================
   교과서 본문 (비상교육 중등 역사② 해당 쪽)
   paras: 문자열=본문, {s:'사료'}, {n:'각주/설명'}
   ============================================================ */
const PASSAGES = {
  'g-dam': { page: '86쪽', title: '서희와 소손녕의 담판', paras: [
    { n: '서희와 소손녕의 대사를 통해 두 사람의 주장을 정리해 보자.' },
    { s: '“아니다. 우리가 바로 고구려의 후계자이다. 그러므로 나라 이름을 고려라 한 것이다.”', by: '서희 쪽 주장' },
    { s: '“이곳 압록강 안팎도 우리 영역인데 여진이 차지하고 있어서 거란으로 통하는 길이 막혔다. 여진을 쫓고 우리 옛 땅을 회복한다면 어찌 거란과 교류하지 않겠는가?”', by: '서희 쪽 주장' },
    { s: '“고려는 신라를 계승하였으므로 고구려의 옛 땅은 우리 거란의 것이다. 그런데 어째서 침범하는가?”', by: '소손녕 쪽 주장' },
    { s: '“우리 거란과 국경을 맞대고 있으면서도 너희가 바다 건너 송을 섬기는 까닭에 이번 정벌을 하게 되었다.”', by: '소손녕 쪽 주장' }
  ]},
  'g-geo': { page: '87쪽', title: '거란의 침입과 격퇴', paras: [
    '동아시아 정세의 변화 고려가 성립한 10세기에는 동아시아의 정세가 크게 변하였다. 만주 일대에서는 거란이 성장하여 발해를 멸망시키고 세력을 확대하였다. 중국에서는 5대 10국의 혼란기를 거쳐서 송이 중국을 다시 통일하였다. 고려는 건국 초부터 북진 정책을 추진하여 거란을 견제하는 한편, 송과 우호적인 관계를 맺었다. 송은 거란을 견제하기 위해 고려와의 친선을 꾀하였다.',
    '거란의 침입과 격퇴 고려가 송과 가깝게 지내자, 송에 대한 공격을 준비하던 거란은 먼저 고려를 침략하였다(993). 고려의 일부 대신들은 북쪽 영토를 내어 주고 거란과 화의를 맺자고 주장하였다. 그러나 서희는 거란 장수 소손녕과 담판을 벌여 거란과 교류할 것을 약속하는 대신 압록강 동쪽의 강동 6주를 고려 영토로 인정받았다. 이로써 고려의 영토는 압록강까지 확대되었다.',
    '이후 거란은 강조의 정변을 구실로 다시 고려를 침략하였다(1010). 이때 고려는 개경이 함락되는 어려움을 겪었으나 양규 등의 활약으로 거란군을 물리쳤다. 3차 침입 때에는 강감찬이 이끄는 고려군이 귀주에서 거란군을 거의 전멸시켰다(귀주 대첩, 1019). 이후 고려는 개경에 나성을 쌓고 국경 지역에 천리장성을 쌓아 북방 민족의 침입에 대비하였다.',
    { n: '강조의 정변: 강조가 목종을 몰아내고 현종을 즉위시킨 사건이다. 거란은 신하가 임금을 시해한 것을 문책한다는 명분을 내세워 고려에 침입하였다.' },
    { n: '거란의 침입과 격퇴: 거란의 소배압이 10만 대군을 이끌고 고려를 침략하자, 고려에서는 강감찬을 상원수, 강민첨을 부원수로 삼아 군사 약 20만 명을 압록강 부근에 머무르게 하였다. 거란군은 흥화진에서 고려군에 패하였지만, 계속 진격하여 개경 부근까지 침략하였다. 그러나 거란군은 개경을 함락하지 못하고, 병력 손실이 커지자 철수를 결정하였다. 고려군은 거란군이 귀주에 도착하였을 때 총공격하였고, 살아 돌아간 거란군은 수천 명뿐이었다.' }
  ]},
  'g-jur': { page: '88쪽', title: '여진 정벌과 동북 9성의 축조', paras: [
    '고려의 동북방 지역에서는 여진이 부족 단위로 흩어져 살았다. 고려는 여진 부족 추장에게 관직을 주고 회유하였다. 그러나 12세기에 여진이 부족 중 하나인 완옌부를 중심으로 통합하면서 점차 세력을 키워 나갔다. 여진은 국경 지역을 자주 침략하였고, 고려는 기병이 강한 여진에 수차례 패하였다.',
    '윤관은 숙종 때 여진을 정벌하기 위하여 특수 부대인 별무반 편성을 건의하였다. 이후 예종 때 별무반을 이끌고 여진 정벌에 나서 동북 지방에 9성을 쌓고 고려의 영토로 삼았다(1107). 그러나 여진이 이 땅을 돌려달라고 요구하고, 여진이 계속 강성하여 방어하는 데 어려움을 겪자 고려는 9성을 여진에 돌려주었다.',
    '이후 여진은 세력을 키워 금을 세우고(1115) 고려에 형제 관계를 제의하였다. 금은 더욱 강성해져 거란(요)을 멸망시키고 고려에 사대 관계를 요구하였다. 고려 조정에서는 이에 대해 반대하는 여론이 높았으나, 집권하고 있던 이자겸 등이 금의 사대 요구를 받아들였다.',
    { n: '별무반: 신기군(기병), 신보군(보병), 항마군(승병)으로 이루어진 특수 부대이다.' }
  ]},
  'g-tr1': { page: '89쪽', title: '송과의 교류', paras: [
    '고려는 건국 초기부터 주변 국가와 활발하게 교류하였다. 고려는 송을 비롯하여 거란(요), 금, 일본 등 주변 국가와 교류하고, 멀리 아라비아 상인과도 교류하였다. 이 시기에 개경에서 가까운 예성강 입구의 벽란도가 국제 무역항으로 번성하였다.',
    '고려는 송과 가장 활발하게 교류하면서 문화적·경제적인 실리를 추구하였다. 고려 초에는 송의 제도를 참고하여 제도를 정비하였고, 사신, 학자 등을 보내 송의 선진 문물을 받아들였다. 초조대장경 간행과 청자 제작, 음악 발달도 송의 영향을 받아 이루어졌다. 한편, 송은 고려와의 관계를 통해 거란, 여진 등 주변 민족을 견제하려 하였다.',
    '고려와 송의 경제적 교류는 주로 송의 상인들이 주도하였다. 북방에 거란, 여진이 있었으므로 서해안의 바닷길을 이용하였다. 송의 상인들은 비단, 서적, 약재 등 왕실과 귀족의 수요품을 고려에 가져왔다. 고려에서는 나전 칠기, 화문석, 종이, 인삼 등을 송에 수출하였다.'
  ]},
  'g-tr2': { page: '90쪽', title: '여러 나라와의 교류', paras: [
    '고려는 거란, 여진 등 북방 민족의 침입을 경계하면서도 이들과 꾸준히 교류하였다. 거란의 침입을 물리친 뒤에는 거란에 정기적으로 사신을 파견하였고, 거란도 고려 국왕의 즉위식이나 생일에 사신을 보내왔다. 고려는 거란에 농기구, 곡식 등을 보내고, 은, 모피 등을 들여왔다. 거란에서 들여온 대장경은 고려의 대장경 편찬에 도움을 주었다. 여진은 고려에 말과 화살 등을 바치고, 식량과 농기구 등 생활필수품을 받아 갔다.',
    '일본 상인과 아라비아 상인도 고려에 찾아왔다. 일본 상인은 수은과 향료를 가져와 식량, 인삼, 책 등과 바꾸어 갔다. 아라비아 상인은 벽란도를 통해 개경에 들어와 수은, 향료, 산호 등을 팔고 금, 비단 등을 사 갔다. 이때 고려는 코리아라는 이름으로 서방 세계에 알려졌다.',
    { n: '코리아: 13세기 중반 몽골을 방문한 프랑스인 뤼브룩이 중국 동쪽에 ‘Caule(고려의 중국음 가오리를 옮긴 것)’라는 나라가 있다고 쓴 것이 서양 최초의 기록이다. 이 Caule가 Coree, Corea, Korea 등으로 변하였다.' },
    { s: '정종 6년(1040) 11월 대식국(아라비아) 상인 보나합 등이 와서 수은, 점성향(베트남에서 생산되는 향신료), 몰약(방부제) 등의 물건을 바쳤다. 왕이 그들을 객관에서 후하게 대접하도록 하고, 그들이 돌아갈 때 금과 비단을 내렸다.', by: '『고려사』 · 아라비아 상인과의 교역' }
  ]},
  'g-mon1': { page: '93쪽', title: '몽골의 침략과 강화 천도', paras: [
    '몽골과의 접촉과 몽골의 침략 13세기 초 중국에서는 금이 쇠퇴하고 몽골이 세력을 확대하였다. 몽골이 금을 공격하자 금의 지배를 받던 거란인이 반란을 일으켰다가 몽골군에 쫓겨 고려에 침입하였다. 고려는 몽골군과 연합하여 거란인이 있던 강동성을 함락하였고, 이 사건을 계기로 고려는 몽골과 국교를 맺었다.',
    '그러나 몽골은 고려를 복속국으로 취급하며 많은 공물을 요구하여 고려와 갈등을 빚었다. 이러한 상황에서 고려에 온 몽골 사신이 귀국하는 길에 살해되자, 몽골은 국교를 끊고 고려를 침략하였다(1231). 몽골의 침입에 맞서 귀주성을 비롯한 북방의 여러 성에서는 백성과 관군이 필사적으로 저항하여 성을 지켰다. 그러나 많은 성이 함락되고 고려의 방어군이 패배하자 최씨 정권은 몽골과 강화를 맺었다. 몽골군은 북방의 점령지와 개경에 다루가치를 두고 돌아갔다.',
    '강화 천도와 장기간의 항전 몽골의 간섭에 맞서 최씨 정권은 수도를 강화도로 옮기고, 백성을 산성과 섬으로 들어가게 하여 항전을 준비하였다. 고려가 강경한 태도를 보이자 몽골은 고려를 다시 침략하였지만 처인성 전투에서 패배하여 돌아갔다(1232). 이후에도 몽골은 여러 차례 침략하였으나 고려의 관군과 백성이 합심하여 항쟁하였다. 이때 사회적으로 차별받던 특수 행정 구역의 주민과 노비도 단결하여 몽골에 저항하였다. 한편, 고려 정부는 민심을 모으고, 불교의 힘으로 몽골을 물리치고자 팔만대장경을 제작하였다.',
    { n: '강화 천도: 고려 조정은 내륙에서 몽골군에 맞서 싸우는 것이 힘들다고 판단하여 수도를 개경에서 강화도로 옮겼다. 강화도는 농사짓는 땅이 많아 식량이 넉넉하였고, 물살이 거세어 해전에 약한 몽골군이 쉽게 접근할 수 없었다.' },
    { n: '처인성 전투: 1232년 승려 김윤후와 처인 부곡의 백성이 처인성에서 몽골군의 총사령관인 살리타를 죽이고 몽골군을 물리쳤다.' },
    { n: '다루가치: ‘속박하는 사람’이라는 몽골어에서 비롯된 말로, 중·하급 관청이나 지방의 최고 책임자를 뜻한다. 고려에 파견된 다루가치는 고려의 내정을 감시하고 감독하였다.' }
  ]},
  'g-mon2': { page: '94쪽', title: '전쟁의 피해와 몽골과의 강화', paras: [
    '고려는 몽골과의 오랜 전쟁으로 국토가 황폐해졌고, 많은 백성이 죽거나 포로로 끌려갔다. 산성이나 섬으로 들어간 백성의 생활도 참담하였다. 또한 대구 부인사의 대장경 판목과 경주의 황룡사 9층 목탑 등 많은 문화유산이 불에 타는 피해를 입었다.',
    '이러한 상황에서 몽골이 강화를 제안하자, 몽골의 요구를 받아들이자는 여론이 높아졌다. 그러나 최씨 정권은 정권을 유지하기 위해 항전을 주장하였다. 결국 무신들은 최씨 정권을 무너뜨리고 몽골과의 강화를 추진하였다.',
    '당시 태자였던 원종은 쿠빌라이를 만나 고려의 독립과 풍속을 유지하는 조건으로 강화를 맺었다. 그러나 몽골의 내정 간섭을 피할 수 없었다. 쿠빌라이는 고려의 수도를 다시 개경으로 옮기고, 일본 원정에 필요한 인력과 물자를 제공하라고 요구하였다. 무신 정권은 다시 몽골에 저항하려 하였으나 내분으로 무너졌고, 고려 정부는 개경으로 돌아왔다(1270).',
    '한편, 무신 정권의 군사적 기반이었던 삼별초는 개경으로 돌아가는 데 반대하며 봉기하였다. 이들은 진도를 근거지로 삼아 남해안 일대를 장악하였다. 그러나 고려와 몽골 연합군의 공격으로 진도가 함락되었고, 남은 세력이 제주도로 옮겨 가 항쟁을 계속하였지만 결국 진압되었다(1273).',
    { s: '1. 복식은 고려의 풍속에 따라 모두 고치지 않는다.\n2. 고려에 가는 행인은 모두 몽골 조정에서만 보내고 그 밖의 왕래는 모두 금한다.\n3. 강화도에서 개경으로 수도를 옮기는 것은 힘이 되는대로 시행한다.\n4. 주둔하는 몽골 군대는 가을을 기한으로 철수한다.\n5. 고려에 설치한 다루가치 일행은 모두 귀환시킨다.', by: '쿠빌라이와 고려 태자의 강화 내용' }
  ]},
  'g-won': { page: '95쪽', title: '원의 내정 간섭', paras: [
    '몽골과의 전쟁이 끝난 뒤 고려는 정치적 독립을 유지하였으나, 몽골(원)의 내정 간섭을 받았다. 몽골(원)은 철령 이북에 쌍성총관부, 서경에 동녕부, 제주도에 탐라총관부를 두어 고려의 영토 일부를 직접 지배하였다. 그리고 일본 원정을 위해 고려에서 함선과 물자, 병사를 제공받았으며, 일본 원정이 끝난 뒤에도 정동행성을 폐지하지 않고 그대로 두어 내정을 간섭하였다.',
    '고려의 국왕은 원의 공주와 혼인하여 원 황실의 사위가 되었고, 왕자들은 원에서 성장하며 교육을 받았다. 고려의 왕실 호칭과 관직 이름도 제후국 수준으로 격이 낮아졌다. ‘폐하’를 ‘전하’로, ‘태자’를 ‘세자’로 고쳤으며, 국왕은 원 황제에게 충성을 의미하는 ‘충(忠)’ 자가 붙은 시호를 받았다. 그리고 원은 고려에 조공이라는 이름으로 각종 공물을 요구하였다. 원은 고려에서 금, 인삼, 사냥용 매 등 특산물을 거두어 갔으며, 환관과 공녀 등 많은 사람들을 끌고 갔다.',
    '원 간섭기에는 고려와 원의 문화 교류가 활발하게 이루어졌다. 고려에서는 몽골식 복장과 음식, 용어 등 몽골풍이 유행하였고, 원에는 고려의 복식과 음식 등 고려의 풍습(고려양)이 전해졌다.',
    { n: '정동행성: ‘행성’은 원이 직할지 통치와 대규모 군사 행동을 위해 설치한 기구이다. 원은 일본 원정을 준비할 때 고려에 정동행성을 설치하였다.' },
    { n: '음식·의복·언어: 몽골의 만두(상화), 소주 등이 고려에 소개되었다. 원에서는 고려의 쌈 음식, 고려병(약과의 일종) 등이 인기를 끌었다. / 고려 남자들은 몽골식 머리(변발)를 하고 원에서 유행한 발립을 썼으며, 철릭을 입었다. 원에서는 고려의 모시가 인기를 끌었고, 상의가 짧은 고려의 의복은 원 황실과 상류층 사이에서 유행하였다. / 몽골의 궁중 용어인 ‘수라’, ‘무수리’ 등이 고려에 전래되었다.' }
  ]},
  'g-gwon': { page: '96쪽', title: '권문세족의 성장', paras: [
    '고려에 대한 원의 간섭은 점차 심해져 원에서 고려의 국왕을 마음대로 임명하고 퇴위시키기에 이르렀다. 심지어 원에서는 고려의 국호를 없애고 고려를 원에 통합하려는 논의가 일었다. 고려는 원종과 쿠빌라이의 강화 조건을 근거로 강력히 항의하여 통합 시도를 좌절시켰으나, 고려의 국제적 위상은 크게 낮아졌다.',
    '잦은 국왕 교체로 왕권이 약해지고 국가의 위상이 낮아지자, 고려에서는 원에 기대어 권력을 누리는 세력이 성장하였다. 친원적 성향을 가진 이들은 새로운 지배 세력인 권문세족을 형성하였다. 권문세족 중에는 전부터 세력을 유지한 가문도 있었지만, 몽골어를 잘해서 통역에 종사하거나 원에서 국왕이나 왕자를 수행하여 성장한 사람들도 있었다. 특히 원 황실과 혼인 관계를 맺은 기철의 가문은 국왕을 압도하는 권력을 누렸다.',
    '권문세족은 높은 관직을 독점하고, 음서를 이용하여 권력을 세습하였다. 또한 다른 사람의 노비와 토지를 빼앗고, 농장을 설치하여 국가에 낼 세금을 가로챘다. 농장 경영에 많은 노동력이 필요하자 권문세족은 가난한 백성을 농장에 숨기거나 노비로 만들었다. 그 결과 국가에 세금을 내는 백성이 줄어들어 국가 재정이 궁핍해졌다. 이러한 문제를 해결하기 위하여 충선왕, 충목왕 등이 개혁을 시도하였으나 권문세족이 원과 연계하여 개혁을 저지하였다.',
    { s: '요즘 들어 간악한 도당들이 남의 토지를 빼앗음이 매우 심하다. 그 규모가 한 주(州)보다 크기도 하고, 군(郡) 전체를 포함해 산천으로 경계를 삼는다. 남의 땅을 조상으로부터 물려받은 땅이라고 우기면서 주인을 내쫓고 땅을 빼앗는다. 한 토지의 주인이 대여섯 명이 넘기도 하니, 농민들은 세금으로 생산량의 8~9할을 내야 한다.', by: '『고려사』 · 권문세족의 횡포' }
  ]},
  'g-gong': { page: '97쪽', title: '공민왕의 개혁 정치', paras: [
    '14세기 중엽에 즉위한 공민왕은 원이 급격히 쇠퇴하자 원의 간섭에서 벗어나 자주성을 회복하려 하였다. 공민왕은 먼저 기철을 비롯한 친원 세력을 제거하고, 고려의 내정을 간섭하는 핵심 기구인 정동행성이문소를 폐지하였다. 그리고 쌍성총관부를 공격하여 동북쪽의 영토를 되찾았다. 아울러 고려 왕실의 호칭과 관청의 옛 제도를 복구하고 원의 풍습을 금지하였다.',
    '원의 간섭을 물리친 뒤 공민왕은 승려 신돈을 등용하여 내정 개혁을 추진하였다. 전민변정도감을 설치하여 권문세족이 빼앗은 토지와 노비를 원래 주인에게 돌려주고 강제로 노비가 된 사람들을 해방하였다. 또한 성균관을 정비하고 유학 교육을 강화하여 개혁을 뒷받침할 세력을 양성하였다.',
    '공민왕의 개혁으로 고려는 자주성을 되찾았고, 새로운 정치 세력이 성장하는 기반을 마련하였다. 그러나 개혁은 권문세족의 강력한 반발에 부딪혔으며, 공민왕이 신돈을 제거하고 공민왕도 시해당하여 지속되지 못하였다.',
    { n: '역사 신문: 고려군이 쌍성총관부를 공격하여 철령 이북의 땅을 점령하였다. 이로써 고려는 충렬왕 때 동녕부와 탐라총관부를 돌려받은 데 이어 원에 빼앗겼던 영토를 모두 회복하고 북방으로 영토를 확장하였다. / 정책 알림: 원의 연호 사용을 중지한다. 오랑캐를 본받아 변발하는 것을 금지한다.' }
  ]},
  'g-sin': { page: '98쪽', title: '신진 사대부와 신흥 무인 세력의 성장', paras: [
    '원 간섭기에는 새로운 정치 세력인 신진 사대부가 등장하였다. 이들은 대부분 하급 관리나 지방 향리의 자제였으며, 권문세족 출신도 있었다. 성리학을 공부하고 과거에 급제하여 관직에 진출하였다. 신진 사대부는 공민왕의 개혁 과정에서 크게 성장하였고, 점차 독자적인 정치 세력을 형성하여 권문세족의 비리를 비판하였다. 또한 원과 명이 교체되던 시기에 명과 화친할 것을 주장하였다.',
    '공민왕이 개혁을 추진하던 때에는 홍건적과 왜구가 고려에 자주 침입하였다. 홍건적은 원이 쇠약해진 틈을 타 반란을 일으킨 농민군으로, 이들 중 일부가 고려에 침입하여 한때 개경을 함락하였다. 왜구는 남쪽 해안 지방을 약탈하다가 점차 내륙 지역과 개경 근처까지 침입하여 큰 피해를 주었다. 이 과정에서 외적의 침입을 물리친 무인들은 백성의 신망을 얻어 정치 세력을 형성하였다. 최영과 이성계는 이 시기에 성장한 대표적인 신흥 무인 세력이었다.',
    { n: '정몽주의 활동(일부): 1360년 과거에 응시하여 장원 급제하였다. / 1367년 성균관에서 성리학을 가르쳤다. / 1374년 권문세족이 명을 배척하고 원과의 관계를 회복하려 하자 정도전 등과 함께 그들의 계획에 반대하다가 유배당하였다. / 1377년 왜구의 침입 문제를 해결하기 위하여 일본으로 가서 왜구 방지에 적극적으로 협조하겠다는 약속을 얻어 냈다.' },
    { n: '지도 자료: 공민왕의 피란로는 개경에서 남쪽으로 이어져 복주(안동)에 이른다. 홍건적은 북쪽에서, 왜구는 남쪽 해안에서 침입하였다.' }
  ]},
  'g-wi': { page: '99쪽', title: '위화도 회군과 고려의 멸망', paras: [
    '고려는 원을 북쪽으로 몰아내고 중국 대륙을 차지한 명과 외교 관계를 맺었다. 그러나 명은 고려를 속국으로 대우하며 무리한 공물을 요구하였다. 심지어 원이 지배하던 옛 쌍성총관부 지역을 직접 다스리겠다고 하였다. 우왕과 최영은 이러한 요구에 반발하여 요동을 공격하기로 결정하였다.',
    '신진 사대부는 명과의 갈등을 외교적으로 해결하자고 주장하였다. 이성계도 요동 정벌에 반대하였으나 우왕의 명령으로 군대를 이끌고 나섰다. 그러나 이성계는 여러 구실을 내세워 압록강의 위화도에서 군대를 돌려 개경을 장악하였고, 우왕과 최영을 몰아내고 정치, 군사의 실권을 잡았다(1388).',
    '한편, 신진 사대부는 위화도 회군 이후에 고려 사회의 개혁 방법을 둘러싸고 분열하였다. 이색, 정몽주 등 온건파는 고려 전기의 제도를 회복하는 방식으로 사회 문제를 해결하자고 주장한 반면, 정도전, 조준 등 급진파는 새 왕조를 세워야 한다고 주장하였다.',
    '정권을 잡은 이성계는 급진파 사대부와 연계하여 개혁을 추진하였다. 이들은 문란해진 조세 제도와 토지 제도를 바로잡아 권문세족의 경제적 기반을 약화하였으며, 왕조 교체에 반대한 정몽주 등을 제거하였다. 마침내 공양왕이 이성계에게 왕위를 내어 주어 고려가 멸망하고 조선이 건국되었다(1392).',
    { n: '위화도 회군: 이성계는 요동 정벌이 불가한 이유를 네 가지 들어 회군을 요청하였지만, 우왕이 이를 허락하지 않자 군대를 돌려 개경으로 향하였다.' }
  ]},
  'j-found': { page: '115쪽', title: '조선의 건국', paras: [
    '고려 말 위화도 회군으로 권력을 장악한 이성계는 정도전을 비롯한 급진파 사대부와 손을 잡고 개혁에 나섰다. 이들은 과전법을 실시하여 어지러운 토지 제도를 바로잡았다. 이로써 국가 재정을 확보하고 자신들의 경제적 기반을 마련하였다. 이어 고려 왕조를 유지하려는 정몽주 등의 온건파 사대부를 제거한 후, 새 왕조를 열었다(1392).',
    '태조 이성계는 고조선을 계승한다는 뜻에서 나라 이름을 ‘조선’으로 바꾸었다. 이어 당시 풍수지리설에서 명당으로 꼽히던 한양으로 도읍을 옮겼다. 한양은 한반도의 중앙에 있고 남쪽으로 한강이 흘러 육로와 수로 교통이 편리하였으며, 산으로 둘러싸여 외적을 막기에 유리하였다.',
    '조선 건국을 이끈 급진파 사대부들은 성리학을 통치 이념으로 삼아 나라의 문물과 제도를 정비하는 데 앞장섰다. 특히 정도전은 현명한 재상이 정치를 이끌어야 한다고 강조하였고, 백성을 근본으로 여기고 인격과 덕으로써 백성을 다스리는 왕도 정치를 추구하였다.',
    '조선의 건국은 사회의 변화를 가져왔다. 신진 사대부가 지배 세력이 됨에 따라 가문보다 개인의 유교적 지식과 교양이 점차 중시되었다. 더불어 불교가 위축되었고, 유교 윤리가 정치·경제·사회·문화 전반에서 중심이 되었다.',
    { n: '과전법: 전·현직 관료에게 경기 지역의 토지에 한하여 수조권이 설정된 토지(과전)를 준 제도이다. (연표: 1388 위화도 회군 → 1391 과전법 실시 → 1392 조선 건국 → 1394 한양 천도)' },
    { n: '정도전: 고려 말 우왕 때 이성계와 만나 새로운 나라를 구상하였다고 한다. 조선이 개국한 뒤에는 태조의 신임을 받아 정치를 주도하였다. 조선의 통치 기준과 운영 원칙을 제시한 『조선경국전』을 저술하였고, 새 수도 한양에 세운 경복궁과 궁궐 건물의 이름을 정하였다. 재상 중심 정치와 왕위 계승 문제로 이방원(태종)과 대립하였고, 결국 1차 왕자의 난 때 이들 세력에게 죽임을 당하였다.' }
  ]},
  'j-kings': { page: '116쪽', title: '국가 기틀의 확립', paras: [
    '이방원은 두 차례에 걸친 왕자의 난으로 정도전과 세자 등을 제거하고 왕위(태종)에 올랐다. 태종은 국왕 중심의 정치를 지향하였다. 공신과 왕자들의 사병을 없애 군사권을 장악하였다. 또한 호적 조사, 호패법 실시 등을 통해 인구를 파악하고 세금 징수와 군역 부과의 기초 자료를 마련하였다.',
    '세종은 태종 때 이룬 안정된 왕권을 바탕으로 유교 정치를 실현하고자 하였다. 집현전을 설치하여 젊고 유능한 학자들이 학문 연구와 정책 자문에 힘쓰도록 하였다. 태종이 축소한 의정부의 권한을 강화하였으며, 경연을 열어 신하들과 정책을 토론하였다. 또한 토지에 매긴 세금 제도를 정비하여 백성의 부담을 줄였다. 소리글자인 훈민정음을 만들어 반포하고 국가의 의례를 정비하였다.',
    '세종의 뒤를 이은 문종이 일찍 죽고 어린 단종이 왕위에 올랐다. 그러나 수양 대군은 단종을 몰아내고 왕위(세조)에 올랐다. 세조는 집현전을 폐지하고, 경연을 열지 않았으며, 의정부의 권한을 약화하였다. 또한 과전이 부족해지자 현직 관리에게만 수조권을 주는 직전법을 시행하였다.',
    '성종은 집현전을 계승한 홍문관을 설치하여 경연을 다시 열었고, 의정부의 권한을 강화하였다. 또한 세조 때 편찬을 시작한 『경국대전』을 완성하여 반포함으로써 유교 중심의 국가 통치 질서를 확립하였다.',
    { n: '경연: 왕과 신하가 함께 유교 경전과 역사서를 읽고 공부하는 제도로, 학문은 물론 정치 현안에 대해 의논하였다.' }
  ]},
  'j-cent': { page: '118쪽', title: '중앙 정치 제도', paras: [
    '조선의 중앙 정치는 의정부와 6조를 중심으로 하였다. 의정부에서는 영의정을 비롯한 3정승이 합의하여 국정을 총괄하였고, 6조는 주요 행정 실무를 나누어 맡았다. 국가의 중요한 일은 국왕을 중심으로 의정부의 3정승과 6조의 판서가 의논하여 결정하였다.',
    '조선은 권력의 독점과 부정을 막기 위해 언론 기능을 담당하는 사간원, 사헌부, 홍문관을 두었고, 이를 3사라고 하였다. 사간원은 국왕이 올바른 정치를 하도록 일깨웠고, 사헌부는 관리의 잘못을 감찰하였다. 홍문관은 국왕의 정책 자문과 경연을 담당하였다. 국왕이나 고위 관리도 3사의 활동을 함부로 막을 수 없었다.',
    '국왕의 비서 역할을 하는 승정원과 중대한 죄인을 다스리는 의금부는 왕권을 뒷받침하였다. 이 밖에도 역사서를 편찬하고 보관하는 춘추관, 유학을 교육하는 성균관, 수도의 행정과 치안을 담당하는 한성부를 두었다.',
    { s: '(사헌부) 정치를 논하고, 모든 관원을 살피며, 풍속을 바로잡고, 원통하고 억울한 일을 밝히며, 거짓된 언행을 금지하는 일을 맡는다. / (사간원) 임금에게 바른말을 하고, 정치의 잘못을 따져 지적하는 일을 맡는다. / (홍문관) 궁궐 안의 책을 관리하고, 왕의 물음에 대비하며 경연을 담당한다.', by: '『경국대전』 · 3사의 역할(교재 자료 2를 기관 이름으로 풀어 씀)' }
  ]},
  'j-local': { page: '119쪽', title: '지방 행정 제도와 교육·관리 등용', paras: [
    '조선은 전국을 8도로 나누고, 도 아래에 부·목·군·현을 두었다. 모든 군·현에 수령을 파견하여 중앙 집권을 강화하였고, 각 도에는 수령을 지휘·감독하는 관찰사를 파견하였다. 고려의 향·부곡·소는 일반 군현에 통합되었고, 향리는 수령의 실무를 보좌하였다. 한편, 각 지방의 양반들은 유향소를 만들어 수령을 돕고 향리의 비리를 감시하였다.',
    '군역 제도와 군사 조직도 정비하였다. 16세에서 60세의 양인 남자는 직접 군인으로 복무하거나 군인의 비용을 부담하였다. 중앙에는 5위를 두어 한양과 궁궐을 수비하였고, 지방의 각 도에서는 병마절도사와 수군절도사가 각각 육군과 수군을 지휘하였다.',
    '조선의 교육은 유교적 지식과 교양을 갖춘 관리를 기르는 데 중점을 두었다. 서당에서는 기초적인 유학 지식을 가르쳤고, 수도의 4부 학당과 지방의 향교에서는 유교 경전을 가르쳤다. 그리고 최고 교육 기관인 성균관에서는 높은 수준의 유학 교육을 실시하였다.',
    '관리 등용 제도에는 과거, 음서, 천거가 있었는데, 주로 과거를 통해 관리를 선발하였다. 과거는 문관을 뽑는 문과, 무관을 뽑는 무과, 기술관을 선발하는 잡과로 나뉘었고, 천민이 아니면 과거에 응시할 수 있었다. 문과에는 주로 양반이 응시하였고, 무과에는 양반을 비롯하여 향리나 상민이, 잡과에는 주로 중인이 응시하였다. 한편, 음서는 고려에 비해 그 범위가 줄고, 음서로 관직에 나간 사람은 과거에 합격하지 못할 경우 낮은 관직에 머물렀다.',
    { n: '수령: 행정 업무뿐만 아니라 재판과 군사 업무도 담당하였다. / 향리의 역할 변화: 고려의 향리는 지방의 세력가였지만, 조선에서는 하급 관리의 처지가 되어 지위가 낮아졌다.' }
  ]},
  'j-ming': { page: '120쪽', title: '사대교린으로 외교적 안정과 실리를 취하다', paras: [
    '조선의 외교 정책은 큰 나라를 섬기는 사대와 이웃 나라와 가깝게 지내는 교린에 바탕을 두었다.',
    '명과의 사대 관계 건국 초기에는 태조가 요동 정벌을 추진하여 명과 대립하였으나, 태종 이후 명과 불필요한 충돌을 피하고 친선을 도모하여 사대 관계를 확립하였다. 조선은 해마다 명에 사신을 보내 말, 인삼 등의 토산품을 조공품으로 보내고, 명으로부터 약재, 서적 등의 답례품을 받았다. 이러한 사대 외교를 통해 조선은 명으로부터 선진 문물을 받아들이고, 왕권의 안정과 조선의 국제적 지위를 확보하는 실리를 추구하였다.',
    '주변국과의 교린 관계 조선은 여진, 일본 등 주변 세력과 교린 관계를 유지하였다. 북방의 여진에게는 국경 지역에 무역소를 설치하여 제한적인 교류를 허용하였고, 귀화한 여진의 지배층에게 관직과 토지를 주어 귀화를 장려하였다. 그러나 여진의 약탈이 계속되자, 세종은 압록강 지역에 최윤덕을 파견하여 4군을 설치하고 두만강 지역에 김종서를 파견하여 6진을 설치하였다. 이로써 오늘날과 같은 국경선이 확정되었다.',
    '조선은 일본 막부 정권과 교린 관계를 맺었다. 그러나 왜구가 서·남해안을 계속 침략하자, 세종은 이종무를 보내 왜구의 소굴인 대마도를 토벌하였다. 이후 대마도 도주의 요청으로 조선은 제포(경남 창원 진해), 부산포(부산), 염포(울산 북구)의 포구를 열어 일본인의 거류와 제한된 무역을 허용하였다. 일본과의 교역은 왜관을 중심으로 이루어졌고, 두 나라는 사신을 보내 교류하였다. 3포에 거주하는 일본인의 수가 늘자 조선은 거류민과 무역의 통제를 강화하였다. 이에 반발하여 3포의 일본인들이 소동을 일으키기도 하였다(삼포 왜란).',
    { s: '명 황제는 큰일을 일으켜 공을 이루는 것을 좋아한다. 만일 우리나라가 조금이라도 사대의 예를 잃으면, 황제는 반드시 군사를 일으켜 죄를 물을 것이다. 나는 한편으로 (명을) 섬기면서, 다른 한편으로는 성을 튼튼히 하고 군량을 저축하는 것을 급선무로 여긴다.', by: '『태종실록』 · 태종이 생각한 명과의 관계' }
  ]},
  'j-hun': { page: '123쪽', title: '훈구의 권력 독점과 사림의 정계 진출', paras: [
    '조선 건국과 국왕 즉위에 앞장선 사대부들은 공신이 되었다. 특히 세조가 왕위에 오르는 데 공을 세운 한명회 등은 고위 관직을 차지하며 정치를 주도하였다. 이들은 그 공로로 국가로부터 많은 토지와 노비를 받았고, 이들 중 일부는 왕실과 혼인 관계를 맺어 세력 기반을 다졌다. 이렇게 형성된 공신과 외척 세력을 훈구라고 한다. 이후 훈구는 대를 이어 권력을 독점하면서 왕권을 제약하였다.',
    '훈구와 달리 고려 말 조선 건국에 참여하지 않고 지방에서 학문 연구와 교육에 힘쓴 사대부의 제자들이 있었는데, 이들을 사림이라고 한다. 사림은 고려 말 온건파 사대부인 정몽주, 길재의 학통을 계승하였고, 도덕과 의리를 바탕으로 하는 왕도 정치와 향촌 자치를 추구하였다.',
    '세조의 뒤를 이은 성종은 왕권을 제약할 정도로 커진 훈구 세력을 견제하기 위해 김종직을 비롯한 영남 지역 출신의 사림을 많이 등용하였다. 사림은 주로 3사의 언관직에 임명되어 훈구 세력의 부정한 행위와 권력 독점을 비판하였다. 그러자 사림 세력과 훈구 세력 간의 정치적 갈등이 심해졌다.'
  ]},
  'j-hwa': { page: '124쪽', title: '훈구와 사림의 갈등', paras: [
    '사림을 우대하던 성종과 달리, 연산군은 사림을 탄압하여 권력을 강화하려 하였다. 이 과정에서 연산군과 훈구 세력은 사초에 실린 김종직의 「조의제문」을 문제 삼아 사림을 제거하였다(무오사화). 이처럼 사림이 큰 피해를 입은 사건을 ‘사화’라고 한다. 뒤이어 연산군이 친어머니의 폐위와 관련된 사람들을 제거하면서 훈구 세력과 함께 사림도 피해를 입었다(갑자사화). 이에 반발하여 훈구 세력은 연산군을 몰아내고 중종을 왕으로 세웠다(중종반정). 훈구 세력이 다시 권력을 장악하자, 중종은 이를 견제하기 위해 조광조를 비롯한 사림을 등용하였다.',
    '조광조는 왕도 정치의 실현을 내세우며 여러 개혁을 추진하였다. 그는 소격서를 폐지하였고, 추천으로 관리를 등용하는 현량과를 실시하였다. 또한 중종이 왕위에 오를 때 부당하게 공신이 된 사람들의 자격을 박탈해야 한다고 주장하였다. 그러나 조광조의 급진적인 개혁에 부담을 느낀 중종은 훈구 세력과 손을 잡고 조광조를 비롯한 사림 세력을 제거하였다(기묘사화). 명종 때에는 많은 사림이 왕의 외척 세력 간에 발생한 권력 다툼에 휩쓸려 또다시 큰 피해를 입었다(을사사화).',
    { n: '조의제문: 자신의 신하였던 항우에게 죽임을 당한 초나라의 왕 의제를 애도한 글이다. 훈구 세력은 김종직이 단종을 몰아낸 세조를 의제를 몰아낸 항우에 빗대어 비판하였다고 주장하였다. / 소격서: 왕실의 도교 행사를 주관하던 예조 소속 관청이다. / 현량과: 학문이 뛰어난 인재를 추천하여 과거를 치르지 않고 등용하는 제도이다.' }
  ]},
  'j-sw': { page: '125쪽', title: '서원의 설립과 향약의 보급', paras: [
    '사화로 피해를 입은 사림은 향촌에서 꾸준히 세력을 키워 나갔다. 사림은 지방 곳곳에 서원을 세워 덕망 높은 유학자를 제사 지내고, 성리학을 연구하며 지방 양반의 자제를 교육하였다. 중종 때 주세붕이 세운 백운동 서원은 명종 때 최초의 사액 서원이 되었다. 이후 국가에서는 서원 설립을 장려하였고, 주요 서원을 사액 서원으로 정하여 토지와 노비, 서적 등을 지급하고 세금을 면제하였다. 서원이 향촌에 자리 잡으면서, 사림은 서원을 중심으로 성리학 이념을 널리 보급하고 정치에 대한 여론을 모으며 세력을 키웠다.',
    '향촌에는 본래 어려운 일이 있을 경우 이웃끼리 서로 돕는 풍속이 있었다. 사림은 이러한 풍속에 유교 윤리를 더하여 향촌 자치 규약인 향약을 만들었다. 향약은 중종 때 사림 세력이 중국의 『여씨향약』을 번역하며 보급되기 시작하였다. 이후 이황과 이이 등이 우리 실정에 맞는 향약을 만들어 군현이나 마을 단위로 시행하였다. 사림은 향약의 규약을 잘 지킨 사람에게는 상을 주고, 어긴 사람에게는 벌을 주는 등 지방 농민들을 성리학 윤리에 맞춰 규율하였다. 이를 바탕으로 사림은 향촌에서 영향력을 넓혀 나갔다.',
    { s: '덕업상권: 좋은 일은 서로 권한다. / 과실상규: 잘못된 것은 서로 규제한다. / 예속상교: 예의 바른 풍속을 교제한다. / 환난상휼: 어려운 일은 서로 돕는다.', by: '『여씨향약』의 네 가지 덕목' }
  ]},
  'j-bung': { page: '126쪽', title: '사림의 집권과 붕당의 형성', paras: [
    '향촌에서 서원과 향약을 바탕으로 세력을 키운 사림은 16세기 후반 선조 때에 이르러 정치의 주도권을 잡았다. 사림은 공론을 존중하고 언론 활동을 보장하는 것이 왕도 정치의 출발점이라고 주장하였다. 언론 기능을 담당하는 3사의 관리들이 공론 형성을 이끌었고, 관직에 나아가지 않고 재야에서 학문을 공부하던 사림들도 서원 활동과 상소 등을 통해 공론 형성에 참여하였다.',
    '이러한 가운데 정계에 남아 있는 훈구 세력에 대한 처리를 둘러싸고 사림 내부에서 갈등이 일어났다. 사림은 훈구 인물을 철저히 배척해야 한다는 세력과 사림에 호의적인 훈구 인물을 포용해야 한다는 세력으로 나뉘었다. 두 세력은 이조 전랑의 임명 문제를 놓고 갈등이 더욱 심해졌다. 이조 전랑은 하급 관리와 3사의 관리를 심사하고 추천할 수 있을 뿐만 아니라 자기 후임자를 추천할 수 있는 관직이었다. 그래서 사림들은 이조 전랑의 자리를 두고 다투었고, 결국 동인과 서인으로 나뉘어 붕당을 형성하였다.',
    '붕당은 정치적·학문적 의견 차이에 따라 형성되었다. 동인은 주로 이황과 조식의 학문을 따르는 영남 지역의 사림이 많았고, 서인은 주로 이이와 성혼의 학문을 따르는 경기·충청 지역의 사림이 중심을 이루었다. 이들은 상대 붕당의 입장을 존중하고 학문적 차이를 인정하면서 상호 비판과 견제로 정치를 이끌어 나갔다. 이후 동인은 이황의 학문을 따르는 남인과 조식의 학문을 따르는 북인으로 나뉘었다.',
    { n: '동인과 서인으로 나뉜 사림: 이조 전랑 자리를 두고 김효원과 심의겸이 갈등하였다. 김효원은 한양의 동쪽 지역에, 심의겸은 한양의 서쪽 지역에 살았다. 이에 김효원과 심의겸을 지지하는 세력을 각각 동인, 서인이라고 하였다.' }
  ]},
  'j-w1': { page: '135쪽', title: '일본의 침략을 막아 내다', paras: [
    '왜란의 발발 16세기 중반 이후 동아시아의 정세는 크게 변화하였다. 명에서는 환관들의 횡포가 심해지고, 몽골과 왜구의 침입으로 사회 불안이 커졌다. 일본에서는 전국 시대를 통일한 도요토미 히데요시가 내부 불만 세력의 관심을 밖으로 돌리고 대륙으로 진출하기 위해 조선 침략을 준비하였다. 조선은 양반 사회의 분열로 정치가 혼란하였고, 군역 제도의 문란 등으로 국방력이 크게 약해져 있었다. 이러한 가운데 1592년 4월, 일본은 ‘명을 정벌하러 가는 데 길을 빌려 달라.’라는 구실로 조선을 침략하였다(임진왜란).',
    '급작스러운 일본군의 침략에 부산진과 동래성이 쉽게 함락되었고, 신립이 지키던 충주 방어선마저 무너졌다. 이에 선조는 급히 광해군을 세자로 책봉하고, 의주까지 피란을 갔다. 그리고 명에 지원을 요청하였다. 일본군은 부산에 상륙한 지 20여 일 만에 한성을 점령하고, 평양을 거쳐 함경도 지역까지 올라왔다.',

  Q(8, 'goryeo', 'goryeo-1', '교과서 사료 확인) 『고려사』의 아라비아 상인 기록에서, 상인들이 바친 물건과 왕이 돌아가는 길에 내린 물건은 각각 무엇인가요?', ['g-tr2'],
    '90쪽 아래쪽 사료 『고려사』(정종 6년)를 한 줄씩 읽어 보세요.',
    '‘바쳤다’와 ‘내렸다’ 두 동사를 기준으로 물건을 나누어 적어 보세요.',
    ['바친 물건: 수은, 점성향, 몰약 등', '돌아갈 때 내린 물건: 금과 비단']),
  Q(9, 'goryeo', 'goryeo-1', '고려는 서방 세계에 어떤 이름으로 알려지게 되었고, 그 이름은 어디에서 유래했나요?', ['g-tr2'],
    '90쪽 ‘여러 나라와의 교류’ 마지막 문장과 각주(코리아)를 읽어 보세요.',
    '각주에서 13세기 서양인이 고려를 어떻게 적었는지, 그 표기가 이후 어떻게 변했는지 따라가 보세요.',
    '‘코리아’. 13세기 몽골을 방문한 프랑스인 뤼브룩이 고려의 중국음 ‘가오리’를 옮겨 Caule라 적은 것이 서양 최초의 기록이며, 이것이 Coree, Corea, Korea로 변했다.'),
  Q(10, 'goryeo', 'goryeo-1', '고려는 거란·여진의 침입을 경계하면서도 이들과 어떻게 지냈나요?', ['g-tr2'],
    '90쪽 ‘여러 나라와의 교류’ 첫 단락에서 거란, 여진 각각과 오간 물품을 찾아보세요.',
    '‘경계하면서도 꾸준히’라는 표현에 주목하고, 사신 파견과 물품 교환으로 나누어 정리해 보세요.',
    ['거란: 정기적으로 사신 파견(거란도 사신을 보냄), 농기구·곡식을 보내고 은·모피를 들여옴, 거란 대장경이 고려 대장경 편찬에 도움', '여진: 말·화살 등을 바치고 식량·농기구 등 생활필수품을 받아 감']),

  // ---------- 고려 · 몽골 ----------
  Q(11, 'goryeo', 'goryeo-2', '고려는 강동성 함락 이후 몽골과 국교를 맺었습니다. 그런데도 몽골이 1차로 고려를 침략하게 된 계기가 된 사건은 무엇인가요?', ['g-mon1'],
    '93쪽 ‘몽골과의 접촉과 몽골의 침략’ 둘째 단락을 읽어 보세요.',
    '몽골이 고려에 요구하던 것과 갈등, 그 직후 ‘사신’에게 일어난 일을 순서대로 찾으세요.',
    '고려에 온 몽골 사신이 귀국하는 길에 살해된 사건. 이에 몽골이 국교를 끊고 고려를 침략했다(1231).'),
  Q(12, 'goryeo', 'goryeo-2', '최씨 정권은 언제, 왜 강화도로 수도를 옮겼나요?', ['g-mon1'],
    '93쪽 지도 위의 설명 글과 연표(1231, 1232, 1270)를 함께 보세요.',
    '연표에서 ‘강화 천도’가 적힌 줄을 찾고, 강화도가 유리했던 이유 두 가지(식량·물살)를 확인하세요.',
    '1232년. 내륙에서 몽골군과 싸우기 힘들다고 판단했고, 강화도는 농사짓는 땅이 많아 식량이 넉넉하며 물살이 거세 해전에 약한 몽골군이 접근하기 어려웠다.'),
  Q(13, 'goryeo', 'goryeo-2', '처인성 전투에서 승리한 사람은 누구인가요?', ['g-mon1'],
    '93쪽 그림 속 ‘처인성 전투’ 설명을 읽어 보세요.',
    '신분이 ‘승려’인 사람과 특수 행정 구역(부곡)의 주민이 함께 이룬 승리예요. 이름을 찾아보세요.',
    '승려 김윤후와 처인 부곡의 백성들. 몽골군 총사령관 살리타를 죽이고 몽골군을 물리쳤다(1232).'),
  Q(14, 'goryeo', 'goryeo-2', '원종(고려 태자 시절)이 쿠빌라이와 맺은 강화의 핵심 조건은 무엇인가요?', ['g-mon2'],
    '94쪽 본문 셋째 단락과 아래 ‘쿠빌라이와 고려 태자의 강화 내용’ 5개 조항을 읽어 보세요.',
    '본문의 ‘독립과 풍속을 유지하는 조건’이 5개 조항 중 어느 것과 이어지는지 보세요.',
    '고려의 독립과 풍속(독자적인 제도와 문화)을 유지한다는 조건으로 강화를 맺었다.'),
  Q(63, 'goryeo', 'goryeo-2', '교과서 사료 확인) 쿠빌라이와 맺은 강화 내용 5개 조항을 꼼꼼히 읽고, 고려가 약속받은 것과 몽골이 하기로 한 것을 나누어 말해 볼까요?', ['g-mon2'],
    '94쪽 아래쪽 ‘쿠빌라이와 고려 태자의 강화 내용’을 하나씩 읽어 보세요.',
    '고려가 지키게 된 것(복식·풍속)과 몽골이 철수·귀환하기로 한 것을 두 칸으로 나누어 정리하세요.',
    ['고려가 약속받은 것: 복식을 고려의 풍속에 따라 고치지 않음, 개경 환도는 힘이 되는 대로 시행', '몽골이 하기로 한 것: 주둔 군대는 가을까지 철수, 다루가치 일행은 모두 귀환', '몽골 쪽 요구: 고려에 가는 행인은 몽골 조정에서만 보내고 그 밖의 왕래는 금함']),

  // ---------- 고려 · 원 간섭기 ----------
  Q(15, 'goryeo', 'goryeo-3', '원이 고려의 영토 일부를 직접 지배하기 위해 둔 세 기구는 무엇인가요?', ['g-won'],
    '95쪽 ‘원의 내정 간섭’ 첫 단락의 첫 두 문장을 보세요.',
    '95쪽 첫 단락의 설명을 지역(철령 이북 · 서경 · 제주도)별로 나누어 읽어 보세요. 각 지역에 어떤 기구를 두었다고 했나요?',
    ['철령 이북: 쌍성총관부', '서경: 동녕부', '제주도: 탐라총관부']),
  Q(16, 'goryeo', 'goryeo-3', '원이 정동행성을 설치한 원래 이유는 무엇이고, 이후 폐지하지 않고 그대로 둔 이유는 무엇인가요?', ['g-won'],
    '95쪽 본문 첫 단락과 아래 각주(정동행성)를 함께 읽어 보세요.',
    '‘설치할 때의 목적’과 ‘일이 끝난 뒤의 쓰임’은 달랐어요. 두 시점을 나누어 보세요.',
    '일본 원정을 준비하기 위해 설치했으나, 원정이 끝난 뒤에도 폐지하지 않고 두어 고려의 내정을 간섭했다.'),
  Q(17, 'goryeo', 'goryeo-3', '원 간섭기에 정치·경제·문화적으로 어떤 모습이 나타났나요?', ['g-won'],
    '95쪽 본문 둘째·셋째 단락과 아래 사진 설명(음식·의복·언어)을 읽어 보세요.',
    '정치(호칭·혼인), 경제(공물), 문화(몽골풍·고려양) 세 칸으로 나누어 하나씩 찾아보세요.',
    ['정치: 국왕이 원 공주와 혼인, 왕실 호칭·관직 격하(폐하→전하, 태자→세자, ‘충’ 자 시호)', '경제: 금·인삼·매 등 특산물과 환관·공녀를 공물로 요구', '문화: 몽골풍(변발·발립·철릭·만두·소주·수라 등) 유행, 원에서는 고려양(고려 의복·쌈·고려병) 유행']),
  Q(18, 'goryeo', 'goryeo-3', '권문세족과 신진 사대부의 특징을 비교할 수 있나요?', ['g-gwon', 'g-sin'],
    '96쪽 ‘권문세족의 성장’과 98쪽 ‘신진 사대부와 신흥 무인 세력’을 번갈아 읽어 보세요.',
    '‘출신 / 정치 성향 / 학문 / 관직 진출 방법’ 네 가지 기준으로 표를 만들어 비교해 보세요.',
    ['권문세족: 원에 기대어 성장한 친원 세력, 높은 관직 독점, 음서로 권력 세습, 농장 설치', '신진 사대부: 대부분 하급 관리·향리의 자제(권문세족 출신도 있음), 성리학 공부, 과거 급제로 관직 진출, 권문세족 비판, 명과 화친 주장']),
  Q(19, 'goryeo', 'goryeo-3', '권문세족 중 기철의 가문은 왜 권력이 컸나요?', ['g-gwon'],
    '96쪽 둘째 단락 마지막 문장에서 기철이 나오는 부분을 찾아보세요.',
    '기철 가문이 누구와 ‘어떤 관계’를 맺었는지 문장 앞부분을 보세요.',
    '원 황실과 혼인 관계를 맺어, 국왕을 압도하는 권력을 누렸다.'),
  Q(20, 'goryeo', 'goryeo-3', '권문세족이 농장을 설치하면서 어떤 문제가 생겼나요?', ['g-gwon'],
    '96쪽 셋째 단락과 『고려사』 사료(권문세족의 횡포)를 읽어 보세요.',
    '토지·노비 탈취 → 세금을 내는 사람 수의 변화 → 국가 재정, 순서로 원인과 결과를 이어 보세요.',
    '남의 노비와 토지를 빼앗고 가난한 백성을 농장에 숨기거나 노비로 만들어 국가에 낼 세금을 가로챘다. 세금을 내는 백성이 줄어 국가 재정이 궁핍해졌고, 농민은 세금으로 생산량의 8~9할을 내야 했다.'),

  // ---------- 고려 · 공민왕·멸망 ----------
  Q(21, 'goryeo', 'goryeo-4', '공민왕이 원의 내정 간섭에서 벗어나기 위해 폐지한 핵심 기구는 무엇인가요?', ['g-gong'],
    '97쪽 ‘공민왕의 개혁 정치’ 첫 단락을 읽어 보세요.',
    '‘내정을 간섭하는 핵심 기구’라고 설명된 곳이에요. 95쪽에서 배운 기구 이름과 비교해 보세요.',
    '정동행성이문소'),
  Q(22, 'goryeo', 'goryeo-4', '공민왕이 되찾은 지역은 어디이며, 어떤 기구를 공격해 되찾았나요? 지도에서 위치도 확인해 보세요.', ['g-gong'],
    '97쪽 본문 첫 단락과 아래 역사 신문의 지도를 함께 보세요.',
    '지도의 색칠된 부분이 어느 방향(지역)인지, 어떤 기구를 공격했는지 확인하세요.',
    '쌍성총관부를 공격하여 철령 이북의 동북쪽 영토를 되찾았다.'),
  Q(23, 'goryeo', 'goryeo-4', '공민왕이 신돈을 등용해 설치한 기구는 무엇이고, 어떤 일을 했나요?', ['g-gong'],
    '97쪽 본문 둘째 단락을 읽어 보세요. 신돈을 등용한 뒤 한 일이 나옵니다.',
    '기구가 하는 일(토지·노비 문제 해결)을 먼저 정리한 뒤, 기구 이름을 찾아보세요.',
    '전민변정도감. 권문세족이 빼앗은 토지와 노비를 원래 주인에게 돌려주고, 강제로 노비가 된 사람들을 해방했다.'),
  Q(24, 'goryeo', 'goryeo-4', '공민왕이 개혁을 뒷받침할 세력을 기르기 위해 정비한 교육 기관은 무엇인가요?', ['g-gong'],
    '97쪽 둘째 단락의 마지막 문장을 보세요.',
    '유학 교육을 강화하기 위해 정비한 곳이에요. 조선에서도 최고 교육 기관이었어요(119쪽).',
    '성균관 (유학 교육을 강화하여 개혁을 뒷받침할 세력을 양성)'),
  Q(25, 'goryeo', 'goryeo-4', '공민왕 때 고려에 자주 침입한 두 세력은 누구이며, 각각 어느 쪽에서 침입했나요?', ['g-sin'],
    '98쪽 둘째 단락과 지도(침입로 표시)를 함께 보세요.',
    '지도에서 두 세력의 침입로가 각각 어느 방향(북/남)에서 시작되는지 구분해 보세요.',
    ['홍건적: 북쪽에서 침입, 한때 개경을 함락', '왜구: 남쪽 해안을 약탈하다 내륙과 개경 근처까지 침입']),
  Q(26, 'goryeo', 'goryeo-4', '홍건적이 침입하자 공민왕은 어디로 피신했나요?', ['g-sin'],
    '98쪽 지도의 ‘공민왕의 피란로’를 따라가 보세요.',
    '피란로의 끝 지점 괄호 안에 오늘날의 도시 이름이 적혀 있어요.',
    '복주(지금의 안동)'),
  Q(27, 'goryeo', 'goryeo-4', '신진 사대부는 어떤 학문을 바탕으로 어떻게 관직에 진출했고, 외교 성향은 어떠했나요?', ['g-sin'],
    '98쪽 첫 단락과 아래 정몽주의 활동 표를 읽어 보세요.',
    '학문(무엇을 공부했나), 관직 진출 방법, 원·명에 대한 태도 세 가지로 나누어 정리하세요.',
    '성리학을 공부하고 과거에 급제하여 관직에 진출했으며, 원·명 교체기에 명과 화친할 것을 주장했다.'),
  Q(28, 'goryeo', 'goryeo-4', '홍건적과 왜구의 침입을 막는 과정에서 성장한 세력은 무엇이며, 대표 인물은 누구인가요?', ['g-sin'],
    '98쪽 둘째 단락의 마지막 부분을 읽어 보세요.',
    '외적을 물리친 ‘무인들’이 백성의 신망을 얻어 무엇을 형성했는지 확인하세요.',
    '신흥 무인 세력. 대표 인물은 최영과 이성계.'),
  Q(29, 'goryeo', 'goryeo-4', '명나라가 고려에 요구한 것은 무엇이며, 우왕과 최영은 어떻게 대응했나요?', ['g-wi'],
    '99쪽 ‘위화도 회군과 고려의 멸망’ 첫 단락을 읽어 보세요.',
    '명이 ‘어떤 지역’을 ‘어떻게 하겠다’고 했는지, 이에 우왕과 최영이 내린 결정이 무엇인지 순서대로 찾으세요.',
    '명은 무리한 공물과 함께 원이 지배하던 옛 쌍성총관부 지역을 직접 다스리겠다고 했다. 우왕과 최영은 이에 반발해 요동을 공격하기로 결정했다.'),

  Q(52, 'joseon', 'joseon-3', '조명 연합군이 일본군으로부터 되찾은 곳은 어디인가요?', ['j-w1'],

    '명의 지원군이 온 뒤 처음 되찾은 중요한 성이에요. 지도에서 ‘조명 연합군’ 표시 옆을 보세요.',
    '평양성'),
  Q(53, 'joseon', 'joseon-3', '명과 일본의 휴전 협상은 어떻게 되었고, 그 결과 어떤 일이 일어났나요?', ['j-w2'],
    '136쪽 ‘정유재란’ 첫 두 문장을 읽어 보세요.',

    '3년에 걸친 협상이 결렬되자 일본이 다시 조선을 침략했다(정유재란, 1597).'),
  Q(54, 'joseon', 'joseon-3', '왜란이 조선·일본·명에 끼친 영향을 한 가지씩 말할 수 있나요?', ['j-w3'],
    '137쪽 ‘왜란의 영향’ 본문을 나라별로 나누어 읽어 보세요.',
    '조선은 첫 단락, 일본과 명은 이어지는 단락에서 각각 한 가지씩 골라 보세요.',
    ['조선: 토지 황폐, 재정 어려움, 인구 감소, 신분 질서 동요, 문화재 소실·약탈', '일본: 도쿠가와 이에야스가 에도 막부를 엶, 약탈한 문화재·끌려간 기술자 등으로 문화 발전', '명: 국력이 약해지고 그 틈에 만주의 여진이 성장']),

  // ---------- 조선 · 광해군·호란 ----------
  Q(55, 'joseon', 'joseon-4', '왜란 이후 광해군이 펼친 정책은 무엇인가요?', ['j-gh'],
    '138쪽 ‘광해군의 정치와 인조반정’ 첫 단락과 둘째 단락 끝부분을 읽어 보세요.',
    '전란 복구를 위해 정비한 두 가지 장부, 국방력 강화를 위해 수리한 것, 외교 방향까지 확인하세요.',
    ['토지 대장과 호적을 정비해 국가 재정 수입을 늘림', '성곽과 무기를 수리해 국방력 강화', '강성해진 후금과 쇠퇴한 명 사이에서 중립 외교']),
  Q(56, 'joseon', 'joseon-4', '광해군의 중립 외교는 무엇이고, 강홍립은 후금에게 어떻게 대처했나요?', ['j-gh'],
    '138쪽 둘째 단락과 사진 설명(양수투항도)을 읽어 보세요.',
    '광해군이 강홍립에게 내린 지시와, 연합군이 패한 뒤 강홍립이 한 선택을 찾으세요.',
    '명과 후금 사이에서 어느 한쪽에 치우치지 않고 실리를 택해 전쟁을 피한 외교. 광해군은 강홍립에게 상황에 따라 적절히 대처하라고 지시했고, 조명 연합군이 패하자 강홍립은 후금에 항복했다.'),
  Q(57, 'joseon', 'joseon-4', '인조반정은 왜 일어났나요?', ['j-gh'],
    '138쪽 셋째 단락을 읽어 보세요.',
    '서인이 반발한 이유가 두 가지(외교 정책, 왕실 문제)였어요. 각각 어떤 가치와 충돌했는지 정리하세요.',
    '서인이 명에 대한 의리와 명분을 중시했는데 광해군이 중립 외교를 펼치자 반발했고, 광해군이 영창 대군을 죽이고 인목 대비를 폐위하자 유교 윤리에 어긋난다며 이를 구실로 정변을 일으켜 인조를 추대했다(1623).'),
  Q(58, 'joseon', 'joseon-4', '후금군이 황해도까지 들어오자 인조가 피신한 곳은 어디인가요?', ['j-gh'],
    '138쪽 ‘정묘호란과 병자호란’ 첫 단락과 지도의 왕실 피란 표시를 보세요.',
    '지도에서 ‘왕실 피란(정묘호란)’ 표시가 가리키는 곳을 확인하세요.',
    '강화도'),
  Q(59, 'joseon', 'joseon-4', '척화론과 주화론이 무엇인가요?', ['j-gh', 'j-peace'],
    '138쪽 마지막 단락과 139쪽 ‘현실과 명분 사이’ 활동의 두 신하 말을 읽어 보세요.',
    '한쪽은 ‘의리(명분)’, 다른 쪽은 ‘현실(나라 보전)’을 내세워요. 각각 본문의 어떤 용어와 연결되는지 보세요.',
    ['주화론: 외교적으로 해결하자는 주장(힘이 부족하니 요구를 받아들여 나라를 보전)', '척화론: 맞서 싸워야 한다는 주장(명의 은혜와 의리를 저버릴 수 없음)']),
  Q(60, 'joseon', 'joseon-4', '주화파의 주장이 힘을 얻자 인조가 굴욕적인 화의를 맺은 사건을 뭐라고 부르나요?', ['j-peace'],
    '139쪽 ‘청과의 화의와 북벌 운동’ 첫 단락을 읽어 보세요.',
    '굴욕적인 화의를 맺은 ‘장소’를 본문에서 찾으면 사건의 이름이 보여요.',
    '삼전도의 굴욕. 구원병이 패하고 강화도가 함락되자 인조가 삼전도에서 청과 굴욕적인 화의를 맺었다(병자호란, 1636).'),
  Q(61, 'joseon', 'joseon-4', '북벌론은 무엇이고, 효종은 무엇을 준비했나요?', ['j-peace'],
    '139쪽 둘째 단락을 읽어 보세요.',
    '북벌론의 ‘목적’, 효종이 준비한 내용 두 가지, 결국 중단된 이유까지 순서대로 찾으세요.',
    '청을 정벌하여 치욕을 씻자는 주장. 효종은 서인을 등용하고 성곽과 무기를 정비하며 군대를 키웠으나, 흉년과 청 공격의 사실상 불가능으로 효종이 죽자 중단되었다.'),
  Q(62, 'joseon', 'joseon-4', '북벌론과 달리, 청과의 교류가 늘면서 청의 문물을 받아들이자는 쪽에서 나타난 움직임은 무엇인가요?', ['j-peace'],
    '139쪽 둘째 단락의 마지막 문장을 읽어 보세요.',
    '북벌론과 정반대 방향의 주장이에요. 청과 ‘교류가 늘면서’ 어떤 움직임이 나타났는지 확인하세요.',
    '청의 발달된 문물을 받아들이자는 움직임(북학론).')
];

/* ============================================================
   상태 / 유틸
   ============================================================ */
const KEY = 'joseon_checklist_states_v2';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function loadState() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {} }

let checked = loadState();
let era = 'goryeo';
let topic = 'all';
const ui = {};   // id -> { hint: 0|1|2, ans: bool }
let lastFocus = null;

const byEra = e => QUESTIONS.filter(q => q.era === e);
const isDone = id => !!checked[id];
const pageOf = q => q.refs.map(r => PASSAGES[r].page).filter((v, i, a) => a.indexOf(v) === i).join(' · ');

/* ---------- 상단 ---------- */
function renderTabs() {
  const total = QUESTIONS.length;
  const left = QUESTIONS.filter(q => !isDone(q.id)).length;
  const defs = [
    ['goryeo', '고려', byEra('goryeo').length],
    ['joseon', '조선', byEra('joseon').length],
    ['review', '다시 볼 것', left]
  ];
  $('#tabs').innerHTML = defs.map(([id, name, n]) =>
    `<button class="tab" role="tab" aria-selected="${era === id}" data-era="${id}">${name}<span class="n">${n}</span></button>`).join('');
}
function renderChips() {
  const list = TOPICS[era];
  const box = $('#chips');
  if (era === 'review') { box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = list.map(t => `<button class="chip" aria-pressed="${t.id === topic}" data-topic="${t.id}">${esc(t.name)}</button>`).join('');
}
function updateProgress() {
  const total = QUESTIONS.length;
  const n = QUESTIONS.filter(q => isDone(q.id)).length;
  const pct = Math.round(n / total * 100);
  $('#progress-text').textContent = `${n} / ${total}`;
  $('#progress-pct').textContent = `${pct}% 달성`;
  $('#progress-bar').style.width = pct + '%';
  $('#progress-bar-wrap').setAttribute('aria-valuenow', pct);
}

/* ---------- 카드 ---------- */
function currentList() {
  if (era === 'review') return QUESTIONS.filter(q => !isDone(q.id));
  let l = byEra(era);
  if (topic !== 'all') l = l.filter(q => q.topicId === topic);
  return l;
}
function revealHTML(q) {
  const s = ui[q.id] || {};
  let h = '';
  if (s.hint >= 1) h += `<div class="box hint"><b>💡 힌트 1</b>${esc(q.h[0])}</div>`;
  if (s.hint >= 2) h += `<div class="box hint"><b>💡 힌트 2</b>${esc(q.h[1])}</div>`;
  if (s.ans) {
    const a = Array.isArray(q.a) ? `<ul>${q.a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${esc(q.a)}</p>`;
    h += `<div class="box ans"><b>✅ 정답</b>${a}</div>`;
  }
  return h;
}
function cardHTML(q) {
  const s = ui[q.id] || {};
  const done = isDone(q.id);
  const hintLabel = !s.hint ? '💡 힌트' : (s.hint === 1 ? '💡 힌트 더 보기' : '💡 힌트 끝');
  return `
    <div class="card-main">
      <button class="check" aria-pressed="${done}" aria-label="Q${q.id} 이해 완료 표시" data-act="check">✓</button>
      <div class="card-body">
        <div class="meta"><span class="num">Q${q.id}</span><span class="page">교재 ${esc(pageOf(q))}</span></div>
        <p class="qtext">${esc(q.q)}</p>
      </div>
    </div>
    <div class="actions">
      <button class="act hint" data-act="hint" aria-expanded="${!!s.hint}" ${s.hint >= 2 ? 'disabled' : ''}>${hintLabel}</button>
      <button class="act" data-act="src">📖 교과서</button>
      <button class="act ans" data-act="ans" aria-expanded="${!!s.ans}">${s.ans ? '정답 숨기기' : '✅ 정답 보기'}</button>
    </div>
    <div class="reveal">${revealHTML(q)}</div>`;
}
function renderList() {
  const list = currentList();
  const box = $('#list');
  const doneN = list.filter(q => isDone(q.id)).length;
  const tp = TOPICS[era].find(t => t.id === topic);
  $('#topic-title').textContent = era === 'review' ? '아직 체크하지 않은 질문'
    : (topic === 'all' ? (era === 'goryeo' ? '고려 전체' : '조선 전체') : (tp ? tp.full : ''));
  $('#topic-progress').textContent = `${doneN} / ${list.length} 완료`;

  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="big">🎉</div><strong>모두 확인했어요!</strong>표시할 질문이 없습니다.</div>`;
    return;
  }
  box.innerHTML = '';
  list.forEach(q => {
    const el = document.createElement('article');
    el.className = 'card' + (isDone(q.id) ? ' done' : '');
    el.dataset.id = q.id;
    el.innerHTML = cardHTML(q);
    box.appendChild(el);
  });
}
function refreshCard(id) {
  const q = QUESTIONS.find(x => x.id === id);
  const el = $(`.card[data-id="${id}"]`);
  if (!q || !el) return;
  el.className = 'card' + (isDone(id) ? ' done' : '');
  el.innerHTML = cardHTML(q);
}
function renderAll() { renderTabs(); renderChips(); renderList(); updateProgress(); }

/* ---------- 이벤트 ---------- */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-era]'); if (!b) return;
  era = b.dataset.era; topic = 'all'; renderAll(); window.scrollTo({ top: 0 });
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-topic]'); if (!b) return;
  topic = b.dataset.topic; renderChips(); renderList();
});
$('#list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('.card'); const id = +card.dataset.id;
  const s = ui[id] || (ui[id] = { hint: 0, ans: false });
  const act = btn.dataset.act;
  if (act === 'check') {
    checked[id] = !checked[id]; saveState();
    if (era === 'review' && checked[id]) { renderAll(); return; }
    refreshCard(id); renderTabs(); updateProgress();
    const list = currentList(); const doneN = list.filter(q => isDone(q.id)).length;
    $('#topic-progress').textContent = `${doneN} / ${list.length} 완료`;
    const nb = $(`.card[data-id="${id}"] [data-act="check"]`); if (nb) nb.focus();
  } else if (act === 'hint') {
    s.hint = Math.min(2, s.hint + 1); refreshCard(id);
    const nb = $(`.card[data-id="${id}"] [data-act="hint"]`); if (nb && !nb.disabled) nb.focus();
  } else if (act === 'ans') {
    s.ans = !s.ans; refreshCard(id);
    const nb = $(`.card[data-id="${id}"] [data-act="ans"]`); if (nb) nb.focus();
  } else if (act === 'src') {
    openSource(id, btn);
  }
});
$('#reset').addEventListener('click', () => {
  if (confirm('체크한 기록을 모두 지울까요?')) { checked = {}; saveState(); renderAll(); }
});

/* ---------- 교과서 본문 시트 ---------- */
function paraHTML(p) {
  if (typeof p === 'string') return `<p>${esc(p)}</p>`;
  if (p.s) return `<div class="src">${esc(p.s).replace(/\n/g, '<br>')}${p.by ? `<small>${esc(p.by)}</small>` : ''}</div>`;
  if (p.n) return `<p class="note">${esc(p.n)}</p>`;
  return '';
}
function openSource(id, trigger) {
  const q = QUESTIONS.find(x => x.id === id); if (!q) return;
  lastFocus = trigger || document.activeElement;
  $('#sheet-q').textContent = `Q${q.id}. ${q.q}`;
  $('#sheet-body').innerHTML = q.refs.map(r => {
    const p = PASSAGES[r];
    return `<section><div class="psg-h"><span class="pp">교재 ${esc(p.page)}</span><span class="pt">${esc(p.title)}</span></div><div class="psg">${p.paras.map(paraHTML).join('')}</div></section>`;
  }).join('');
  $('#sheet-body').scrollTop = 0;
  $('#overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#close').focus();
}
function closeSource() {
  $('#overlay').classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#close').addEventListener('click', closeSource);
$('#close2').addEventListener('click', closeSource);
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSource(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeSource();
});

renderAll();
</script>
</body>
</html>
